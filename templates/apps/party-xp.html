<form autocomplete="off">
    <div class="wwn-dialog-body">
        <div class="form-group">
            <label>{{localize "WWN.dialog.amount"}}</label>
            <div class="form-fields">
                <input name="total" placeholder="0" type="number" data-dtype="Number" />
            </div>
            <button type="button" data-action="calculate-share" title="{{localize 'WWN.dialog.calculateShare'}}">
                <i class="fas fa-calculator"></i>
            </button>
        </div>
        <hr />
        <div class="actors">
            {{#each actors as |e|}}
            <div class="actor form-group" data-actor-id="{{e.id}}">
                <label>{{e.name}} ({{e.system.details.xp.share}}%)</label>
                <div class="form-fields">
                    <input name="" placeholder="0" type="number" data-dtype="Number" />
                </div>
            </div>
            {{/each}}
        </div>
    </div>
</form>
